<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess 1v1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: #0d131f;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    justify-content: center;
    padding: 10px 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  .app { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 8px; }
  .header { display: flex; justify-content: space-between; align-items: center; background: #172133; padding: 8px 12px; border-radius: 6px; }
  .title { font-weight: 700; color: #f59e0b; font-size: 15px; }
  .btn { background: #25334d; color: #fff; border: none; border-radius: 5px; padding: 5px 12px; font-size: 13px; cursor: pointer; }
  .player { display: flex; justify-content: space-between; background: #172133; padding: 6px 12px; border-radius: 6px; font-size: 13px; }
  .badge { background: #d97706; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .hidden { display: none; }

  /* 1:1 Aspect ratio board */
  .board-wrap { width: 100%; position: relative; padding-top: 100%; border: 3px solid #332314; border-radius: 6px; background: #4a3525; }
  .board { position: absolute; top:0; left:0; width:100%; height:100%; display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); }
  .sq { display: flex; align-items: center; justify-content: center; position: relative; font-size: min(10vw, 42px); line-height: 1; cursor: pointer; }
  .light { background: #eed6b0; }
  .dark  { background: #b88756; }
  .sel   { background: #7fa650 !important; }
  .last  { background: rgba(255, 235, 59, 0.45); }
  .check { background: rgba(220, 38, 38, 0.65) !important; }

  /* White & Black piece styling for high contrast */
  .p-w { color: #ffffff; filter: drop-shadow(0 1px 2px #000) drop-shadow(0 0 1px #000); }
  .p-b { color: #151515; filter: drop-shadow(0 0 1px #fff); }

  /* Legal move dots */
  .move-dot { width: 28%; height: 28%; border-radius: 50%; background: rgba(0,0,0,0.25); pointer-events: none; }
  .cap-ring { width: 80%; height: 80%; border-radius: 50%; border: 3px solid rgba(0,0,0,0.3); pointer-events: none; }

  /* Secret 3-Tap Covert micro-dot (1.5px subtle grey) */
  .secret-dot { position: absolute; top: 2px; left: 2px; width: 1.5px; height: 1.5px; background: rgba(130, 130, 130, 0.45); border-radius: 50%; pointer-events: none; z-index: 10; }

  /* Natural blank whitespace trigger */
  #tapSpace { width: 100%; height: 45px; background: transparent; cursor: pointer; }

  .status { background: #172133; padding: 8px 12px; border-radius: 6px; font-size: 13px; color: #10b981; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="title">Chess 1v1</div>
    <div style="display:flex;gap:6px;">
      <button class="btn" onclick="undoMove()">Undo</button>
      <button class="btn" onclick="resetGame()">New</button>
    </div>
  </div>

  <div class="player">
    <span>Black (Player 2)</span>
    <span class="badge hidden" id="bTurn">TURN</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="boardEl"></div>
  </div>

  <div class="player">
    <span>White (Player 1)</span>
    <span class="badge" id="wTurn">TURN</span>
  </div>

  <!-- The 3-tap hidden trigger space -->
  <div id="tapSpace"></div>

  <div class="status" id="statusTxt">White to move. Game active.</div>
</div>

<script>
const UNICODE = {
  P:'♟', N:'♞', B:'♝', R:'♜', Q:'♛', K:'♚',
  p:'♟', n:'♞', b:'♝', r:'♜', q:'♛', k:'♚'
};

const INIT = [
  'r','n','b','q','k','b','n','r',
  'p','p','p','p','p','p','p','p',
  '','','','','','','','',
  '','','','','','','','',
  '','','','','','','','',
  '','','','','','','','',
  'P','P','P','P','P','P','P','P',
  'R','N','B','Q','K','B','N','R'
];

let board = [...INIT];
let turn = 'w';
let selected = null;
let legalMoves = [];
let history = [];
let secretHint = null;

const OPENINGS = [
  {from: 52, to: 36}, // e4
  {from: 51, to: 35}, // d4
  {from: 50, to: 34}, // c4
  {from: 62, to: 45}  // Nf3
];
let sessionOpening = OPENINGS[Math.floor(Math.random() * OPENINGS.length)];

function isW(p){ return p && p === p.toUpperCase(); }
function isB(p){ return p && p === p.toLowerCase(); }
function opp(p, t){ return t === 'w' ? isB(p) : isW(p); }

function getRaw(b, sq, color){
  const p = b[sq];
  if(!p) return [];
  const res = [];
  const r = Math.floor(sq / 8), c = sq % 8;
  const T = p.toUpperCase();

  if(T === 'P'){
    const d = (color === 'w') ? -1 : 1;
    const f1 = (r + d)*8 + c;
    if(f1 >= 0 && f1 < 64 && !b[f1]){
      res.push(f1);
      const f2 = (r + d*2)*8 + c;
      if((color === 'w' && r === 6) || (color === 'b' && r === 1)){
        if(!b[f2]) res.push(f2);
      }
    }
    for(const dc of [-1, 1]){
      const tc = c + dc;
      if(tc >= 0 && tc < 8){
        const cap = (r + d)*8 + tc;
        if(b[cap] && opp(b[cap], color)) res.push(cap);
      }
    }
  } else if(T === 'N'){
    const j = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for(const [dr,dc] of j){
      const tr = r + dr, tc = c + dc;
      if(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!b[t] || opp(b[t], color)) res.push(t);
      }
    }
  } else if(T === 'K'){
    for(let dr=-1; dr<=1; dr++){
      for(let dc=-1; dc<=1; dc++){
        if(!dr && !dc) continue;
        const tr = r + dr, tc = c + dc;
        if(tr>=0 && tr<8 && tc>=0 && tc<8){
          const t = tr*8 + tc;
          if(!b[t] || opp(b[t], color)) res.push(t);
        }
      }
    }
  } else {
    const dirs = [];
    if(T==='B'||T==='Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if(T==='R'||T==='Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    for(const [dr,dc] of dirs){
      let tr = r + dr, tc = c + dc;
      while(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!b[t]) res.push(t);
        else { if(opp(b[t], color)) res.push(t); break; }
        tr += dr; tc += dc;
      }
    }
  }
  return res;
}

function sim(b, from, to){
  const nb = [...b];
  nb[to] = nb[from];
  nb[from] = '';
  if(nb[to] === 'P' && to < 8) nb[to] = 'Q';
  if(nb[to] === 'p' && to >= 56) nb[to] = 'q';
  return nb;
}

function inCheck(b, color){
  const k = b.indexOf(color === 'w' ? 'K' : 'k');
  if(k === -1) return false;
  const enemy = color === 'w' ? 'b' : 'w';
  for(let i=0; i<64; i++){
    if(b[i] && (enemy === 'w' ? isW(b[i]) : isB(b[i]))){
      if(getRaw(b, i, enemy).includes(k)) return true;
    }
  }
  return false;
}

function legal(sq){
  const p = board[sq];
  if(!p || (turn === 'w' ? !isW(p) : !isB(p))) return [];
  return getRaw(board, sq, turn).filter(to => !inCheck(sim(board, sq, to), turn));
}

function allLegal(c){
  const res = [];
  for(let i=0; i<64; i++){
    if(board[i] && (c === 'w' ? isW(board[i]) : isB(board[i]))){
      const ms = legal(i);
      for(const to of ms) res.push({from: i, to});
    }
  }
  return res;
}

function draw(){
  const boardEl = document.getElementById('boardEl');
  boardEl.innerHTML = '';
  const last = history[history.length - 1];
  const checked = inCheck(board, turn);
  const kingSq = board.indexOf(turn === 'w' ? 'K' : 'k');

  for(let i=0; i<64; i++){
    const r = Math.floor(i/8), c = i%8;
    const sq = document.createElement('div');
    sq.className = `sq ${(r+c)%2===0 ? 'light' : 'dark'}`;
    if(i === selected) sq.classList.add('sel');
    if(last && (i === last.from || i === last.to)) sq.classList.add('last');
    if(checked && i === kingSq) sq.classList.add('check');

    if(board[i]){
      const span = document.createElement('span');
      span.className = isW(board[i]) ? 'p-w' : 'p-b';
      span.textContent = UNICODE[board[i]];
      sq.appendChild(span);
    }

    if(legalMoves.includes(i)){
      const d = document.createElement('div');
      d.className = board[i] ? 'cap-ring' : 'move-dot';
      sq.appendChild(d);
    }

    if(secretHint && (i === secretHint.from || i === secretHint.to)){
      const micro = document.createElement('div');
      micro.className = 'secret-dot';
      sq.appendChild(micro);
    }

    sq.onclick = () => onSq(i);
    boardEl.appendChild(sq);
  }

  document.getElementById('wTurn').className = turn === 'w' ? 'badge' : 'badge hidden';
  document.getElementById('bTurn').className = turn === 'b' ? 'badge' : 'badge hidden';

  const moves = allLegal(turn);
  const st = document.getElementById('statusTxt');
  if(moves.length === 0){
    st.textContent = checked ? `Checkmate! ${turn === 'w' ? 'Black' : 'White'} wins.` : 'Stalemate (Draw).';
    st.style.color = checked ? '#ef4444' : '#eab308';
  } else if(checked){
    st.textContent = `${turn === 'w' ? 'White' : 'Black'} in Check!`;
    st.style.color = '#ef4444';
  } else {
    st.textContent = `${turn === 'w' ? 'White' : 'Black'} to move. Game active.`;
    st.style.color = '#10b981';
  }
}

function onSq(i){
  if(selected !== null && legalMoves.includes(i)){
    history.push({ board: [...board], turn, from: selected, to: i });
    board = sim(board, selected, i);
    turn = turn === 'w' ? 'b' : 'w';
    selected = null;
    legalMoves = [];
    secretHint = null;
    draw();
    return;
  }
  const p = board[i];
  if(p && (turn === 'w' ? isW(p) : isB(p))){
    selected = i;
    legalMoves = legal(i);
  } else {
    selected = null;
    legalMoves = [];
  }
  draw();
}

function undoMove(){
  if(!history.length) return;
  const prev = history.pop();
  board = prev.board;
  turn = prev.turn;
  selected = null;
  legalMoves = [];
  secretHint = null;
  draw();
}

function resetGame(){
  board = [...INIT];
  turn = 'w';
  selected = null;
  legalMoves = [];
  history = [];
  secretHint = null;
  sessionOpening = OPENINGS[Math.floor(Math.random() * OPENINGS.length)];
  draw();
}

// Secret Engine
const VALS = { P:100, N:320, B:330, R:500, Q:900, K:20000 };
function evalBoard(b){
  let score = 0;
  for(let i=0; i<64; i++){
    if(!b[i]) continue;
    const v = VALS[b[i].toUpperCase()] || 0;
    score += isW(b[i]) ? v : -v;
  }
  return score;
}

function getBestMove(){
  if(!history.length && board[sessionOpening.from] === 'P') return sessionOpening;
  const moves = allLegal('w');
  if(!moves.length) return null;
  let best = moves[0], maxScore = -999999;
  for(const m of moves){
    const nextB = sim(board, m.from, m.to);
    let score = evalBoard(nextB);
    if(inCheck(nextB, 'b')) score += 50;
    if(score > maxScore){ maxScore = score; best = m; }
  }
  return best;
}

// 3-Tap Trigger
let taps = [];
document.getElementById('tapSpace').addEventListener('pointerup', (e) => {
  e.preventDefault();
  const now = Date.now();
  if(taps.length && now - taps[taps.length - 1] < 120) return;
  taps.push(now);
  taps = taps.filter(t => now - t <= 2200);
  if(taps.length >= 3){
    taps = [];
    if(turn === 'w'){
      secretHint = secretHint ? null : getBestMove();
      draw();
    }
  }
});

draw();
</script>
</body>
</html>
