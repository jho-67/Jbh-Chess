  <style>

  </style>
</head>

  <!-- JAVASCRIPT GAME ENGINE -->
  <script>
    /* =========================================================================
       CHESS UNICODE GLYPHS & EVALUATION TABLES
       ========================================================================= */
    const GLYPHS = {
      'wK': '♔', 'wQ': '♕', 'wR': '♖', 'wB': '♗', 'wN': '♘', 'wP': '♙',
      'bK': '♚', 'bQ': '♛', 'bR': '♜', 'bB': '♝', 'bN': '♞', 'bP': '♟'
    };

    const PIECE_VALS = { 'P': 100, 'N': 320, 'B': 330, 'R': 500, 'Q': 900, 'K': 20000 };
    const PST_P = [
      [0,  0,  0,  0,  0,  0,  0,  0],
      [50, 50, 50, 50, 50, 50, 50, 50],
      [10, 10, 20, 30, 30, 20, 10, 10],
      [5,  5, 10, 25, 25, 10,  5,  5],
      [0,  0,  0, 20, 20,  0,  0,  0],
      [5, -5,-10,  0,  0,-10, -5,  5],
      [5, 10, 10,-20,-20, 10, 10,  5],
      [0,  0,  0,  0,  0,  0,  0,  0]
    ];
    const PST_N = [
      [-50,-40,-30,-30,-30,-30,-40,-50],
      [-40,-20,  0,  0,  0,  0,-20,-40],
      [-30,  0, 10, 15, 15, 10,  0,-30],
      [-30,  5, 15, 20, 20, 15,  5,-30],
      [-30,  0, 15, 20, 20, 15,  0,-30],
      [-30,  5, 10, 15, 15, 10,  5,-30],
      [-40,-20,  0,  5,  5,  0,-20,-40],
      [-50,-40,-30,-30,-30,-30,-40,-50]
    ];

    // Session opening choices for White
    const OPENING_OPTIONS = [
      { fromR: 6, fromC: 4, toR: 4, toC: 4, isDouble: true }, // 1. e4
      { fromR: 6, fromC: 3, toR: 4, toC: 3, isDouble: true }, // 1. d4
      { fromR: 6, fromC: 2, toR: 4, toC: 2, isDouble: true }, // 1. c4
      { fromR: 7, fromC: 6, toR: 5, toC: 5 }                  // 1. Nf3
    ];

    /* =========================================================================
       AUDIO SYNTHESIZER
       ========================================================================= */
    let audioCtx = null;
    let audioMuted = false;

    function playSound(freq, duration, type = 'sine', vol = 0.08) {
      if (audioMuted) return;
      try {
        if (!audioCtx) {
          const Ctor = window.AudioContext || window.webkitAudioContext;
          if (Ctor) audioCtx = new Ctor();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        if (!audioCtx) return;

        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    /* =========================================================================
       CORE GAME STATE
       ========================================================================= */
    let board = [];
    let currentTurn = 'w';
    let selectedSquare = null;
    let validMoves = [];
    let castlingRights = { wK: true, wQ: true, bK: true, bQ: true };
    let enPassant = null;
    let capturedWhite = [];
    let capturedBlack = [];
    let historyStack = [];
    let isGameOver = false;
    let pendingPromo = null;
    let secretHintMove = null;
    let sessionOpening = null;

    function startMatch() {
      board = [
        ['bR', 'bN', 'bB', 'bQ', 'bK', 'bB', 'bN', 'bR'],
        ['bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP', 'bP'],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        [null, null, null, null, null, null, null, null],
        ['wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP', 'wP'],
        ['wR', 'wN', 'wB', 'wQ', 'wK', 'wB', 'wN', 'wR']
      ];
      currentTurn = 'w';
      selectedSquare = null;
      validMoves = [];
      castlingRights = { wK: true, wQ: true, bK: true, bQ: true };
      enPassant = null;
      capturedWhite = [];
      capturedBlack = [];
      historyStack = [];
      isGameOver = false;
      secretHintMove = null;

      // Randomize session opening choice
      sessionOpening = { ...OPENING_OPTIONS[Math.floor(Math.random() * OPENING_OPTIONS.length)] };

      saveState();
      renderBoardUI();
      updateStatusDisplays();
    }

    function cloneBoard(b) {
      return b.map(row => [...row]);
    }

    function saveState() {
      historyStack.push({
        board: cloneBoard(board),
        turn: currentTurn,
        castles: { ...castlingRights },
        ep: enPassant ? { ...enPassant } : null,
        capW: [...capturedWhite],
        capB: [...capturedBlack]
      });
    }

    function undoMove() {
      if (historyStack.length <= 1 || isGameOver) return;
      historyStack.pop();
      const prev = historyStack[historyStack.length - 1];
      board = cloneBoard(prev.board);
      currentTurn = prev.turn;
      castlingRights = { ...prev.castles };
      enPassant = prev.ep ? { ...prev.ep } : null;
      capturedWhite = [...prev.capW];
      capturedBlack = [...prev.capB];
      selectedSquare = null;
      validMoves = [];
      secretHintMove = null;
      renderBoardUI();
      updateStatusDisplays();
    }

    /* =========================================================================
       RULES & MOVE GENERATION
       ========================================================================= */
    function inBounds(r, c) { return r >= 0 && r < 8 && c >= 0 && c < 8; }

    function getRawMoves(b, r, c, ep, castles) {
      const piece = b[r][c];
      if (!piece) return [];
      const col = piece[0];
      const type = piece[1];
      const moves = [];

      const addMove = (toR, toC, meta = {}) => {
        moves.push({ fromR: r, fromC: c, toR, toC, ...meta });
      };

      if (type === 'P') {
        const dir = col === 'w' ? -1 : 1;
        const startR = col === 'w' ? 6 : 1;
        const promoR = col === 'w' ? 0 : 7;

        if (inBounds(r + dir, c) && !b[r + dir][c]) {
          if (r + dir === promoR) {
            addMove(r + dir, c, { isPromo: true });
          } else {
            addMove(r + dir, c);
            if (r === startR && !b[r + 2 * dir][c]) {
              addMove(r + 2 * dir, c, { isDouble: true });
            }
          }
        }

        for (const dc of [-1, 1]) {
          const nr = r + dir;
          const nc = c + dc;
          if (inBounds(nr, nc)) {
            const dest = b[nr][nc];
            if (dest && dest[0] !== col) {
              if (nr === promoR) addMove(nr, nc, { isPromo: true });
              else addMove(nr, nc);
            } else if (ep && ep.r === nr && ep.c === nc) {
              addMove(nr, nc, { isEp: true });
            }
          }
        }
      } else if (type === 'N') {
        const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
        for (const [dr, dc] of jumps) {
          const nr = r + dr, nc = c + dc;
          if (inBounds(nr, nc) && (!b[nr][nc] || b[nr][nc][0] !== col)) {
            addMove(nr, nc);
          }
        }
      } else if (type === 'B' || type === 'R' || type === 'Q') {
        const dirs = [];
        if (type === 'B' || type === 'Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
        if (type === 'R' || type === 'Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
        for (const [dr, dc] of dirs) {
          let step = 1;
          while (true) {
            const nr = r + dr * step, nc = c + dc * step;
            if (!inBounds(nr, nc)) break;
            const dest = b[nr][nc];
            if (!dest) {
              addMove(nr, nc);
            } else {
              if (dest[0] !== col) addMove(nr, nc);
              break;
            }
            step++;
          }
        }
      } else if (type === 'K') {
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            if (dr === 0 && dc === 0) continue;
            const nr = r + dr, nc = c + dc;
            if (inBounds(nr, nc) && (!b[nr][nc] || b[nr][nc][0] !== col)) {
              addMove(nr, nc);
            }
