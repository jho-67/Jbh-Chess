<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess 1v1</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
  }
  body {
    background: #0d131f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 10px 8px;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  .app { 
    width: 100%; 
    max-width: 400px; 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
  }
  
  /* Connection Bar */
  .room-panel {
    background: #172133;
    padding: 8px 10px;
    border-radius: 6px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    font-size: 13px;
  }
  .room-inputs {
    display: flex;
    gap: 6px;
    align-items: center;
    width: 100%;
  }
  .input-code {
    background: #0d131f;
    border: 1px solid #374151;
    color: #fff;
    padding: 5px 8px;
    border-radius: 4px;
    font-size: 12px;
    width: 80px;
    text-transform: uppercase;
    text-align: center;
    font-weight: bold;
  }
  .net-status {
    font-size: 12px;
    color: #94a3b8;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
  }
  .status-dot.online { background: #10b981; }

  .bar { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: #172133; 
    padding: 8px 12px; 
    border-radius: 6px; 
    font-size: 14px; 
    font-weight: bold; 
    height: 38px;
  }
  .btn { 
    background: #25334d; 
    color: #fff; 
    border: none; 
    border-radius: 5px; 
    padding: 5px 9px; 
    font-size: 12px;
    cursor: pointer; 
  }
  .btn-green { background: #059669; }
  .badge { 
    background: #d97706; 
    padding: 2px 6px; 
    border-radius: 4px; 
    font-size: 11px; 
  }

  /* FROZEN BOARD GEOMETRY */
  .board-wrap { 
    width: 100%; 
    position: relative; 
    padding-top: 100%;
    border: 3px solid #332314; 
    border-radius: 4px; 
    background: #4a3525;
    overflow: hidden;
    contain: layout size paint;
  }
  .board { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    display: grid; 
    grid-template-columns: repeat(8, 12.5%); 
    grid-template-rows: repeat(8, 12.5%); 
  }
  .sq { 
    width: 100%;
    height: 100%;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    overflow: hidden;
    cursor: pointer; 
    contain: strict;
  }
  .l { background: #eed6b0; }
  .d { background: #b88756; }
  .sel { background: #7fa650 !important; }
  .check-king { background: rgba(220, 38, 38, 0.7) !important; }

  /* Normalized piece icons */
  .p-icon {
    font-size: min(8vw, 36px);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    transform: translateY(-1px);
  }
  .w { color: #ffffff; text-shadow: 0 0 2px #000, 0 1px 3px #000; }
  .b { color: #151515; text-shadow: 0 0 1px #fff; }

  /* Move helper indicators */
  .m-dot { width: 28%; height: 28%; border-radius: 50%; background: rgba(0,0,0,0.25); pointer-events: none; }
  .m-ring { width: 80%; height: 80%; border-radius: 50%; border: 3px solid rgba(0,0,0,0.3); pointer-events: none; }

  /* 1px ultra-stealth faint micro-pixel */
  .secret-dot {
    position: absolute;
    top: 1px;
    left: 1px;
    width: 1px;
    height: 1px;
    background: rgba(100, 95, 90, 0.68);
    pointer-events: none;
    z-index: 20;
  }

  /* Covert multi-tap empty whitespace trigger */
  #tapSpace {
    width: 100%;
    height: 52px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .status { 
    background: #172133; 
    padding: 8px 12px; 
    border-radius: 6px; 
    font-size: 13px; 
    color: #10b981; 
    height: 38px;
    display: flex;
    align-items: center;
  }
</style>
</head>
<body>

<div class="app">
  <div class="room-panel">
    <div class="net-status">
      <span class="status-dot" id="dotNet"></span>
      <span id="txtNet">Local (1 vs 1)</span>
    </div>
    <div class="room-inputs">
      <button class="btn btn-green" id="btnHost" onclick="hostRoom()">Host</button>
      <input type="text" id="joinCode" class="input-code" placeholder="CODE" maxlength="5">
      <button class="btn" onclick="joinRoom()">Join</button>
      <button class="btn" onclick="undo()">Undo</button>
      <button class="btn" onclick="location.reload()">Reset</button>
    </div>
  </div>

  <div class="bar">
    <span id="topPlayerLabel">Black (Player 2)</span>
    <span id="topTurn" class="badge" style="display:none">TURN</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="bGrid"></div>
  </div>

  <div class="bar">
    <span id="botPlayerLabel">White (You)</span>
    <span id="botTurn" class="badge">TURN</span>
  </div>

  <!-- Multi-Action Covert Tap Zone -->
  <div id="tapSpace"></div>

  <div class="status" id="stMsg">White to move. Game active.</div>
</div>

<script>
const S = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];
let board = [...S], turn = 'w', sel = null, hist = [], hint = null, isGameOver = false;

let myRole = 'w';
let perspective = 'w';
let isOnline = false;
let peer = null, conn = null;

const OPENS = [{f:52,t:36},{f:51,t:35},{f:50,t:34},{f:62,t:45}];
const bookMove = OPENS[Math.floor(Math.random()*OPENS.length)];

function isW(p){ return p && p === p.toUpperCase(); }
function isB(p){ return p && p === p.toLowerCase(); }
function opp(p, t){ return t === 'w' ? isB(p) : isW(p); }

function getRaw(b, sq, color){
  const p = b[sq];
  if(!p) return [];
  const res = [], r = Math.floor(sq/8), c = sq%8, T = p.toUpperCase();

  if(T === 'P'){
    const d = (color === 'w') ? -1 : 1;
    const f1 = (r + d)*8 + c;
    if(f1 >= 0 && f1 < 64 && !b[f1]){
      res.push(f1);
      const f2 = (r + d*2)*8 + c;
      if(((color === 'w' && r === 6) || (color === 'b' && r === 1)) && !b[f2]) res.push(f2);
    }
    for(const dc of [-1, 1]){
      const tc = c + dc;
      if(tc >= 0 && tc < 8){
        const cap = (r + d)*8 + tc;
        if(b[cap] && opp(b[cap], color)) res.push(cap);
      }
    }
  } else if(T === 'N'){
    for(const [dr,dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
      const tr = r + dr, tc = c + dc;
      if(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!b[t] || opp(b[t], color)) res.push(t);
      }
    }
  } else if(T === 'K'){
    for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++){
      if(!dr && !dc) continue;
      const tr = r + dr, tc = c + dc;
      if(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!b[t] || opp(b[t], color)) res.push(t);
      }
    }
  } else {
    const dirs = [];
    if(T==='B'||T==='Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if(T==='R'||T==='Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    for(const [dr,dc] of dirs){
      let tr = r + dr, tc = c + dc;
      while(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!b[t]) res.push(t);
        else { if(opp(b[t], color)) res.push(t); break; }
        tr += dr; tc += dc;
      }
    }
  }
  return res;
}

function sim(b, from, to){
  const nb = [...b];
  nb[to] = nb[from];
  nb[from] = '';
  if(nb[to] === 'P' && to < 8) nb[to] = 'Q';
  if(nb[to] === 'p' && to >= 56) nb[to] = 'q';
  return nb;
}

function inCheck(b, color){
  const kSq = b.indexOf(color === 'w' ? 'K' : 'k');
  if(kSq === -1) return true;
  const enemy = color === 'w' ? 'b' : 'w';
  for(let i=0; i<64; i++){
    if(b[i] && (enemy === 'w' ? isW(b[i]) : isB(b[i]))){
      if(getRaw(b, i, enemy).includes(kSq)) return true;
    }
  }
  return false;
}

function getLegalMoves(sq){
  const p = board[sq];
  if(!p || (turn === 'w' ? !isW(p) : !isB(p))) return [];
  const rawMoves = getRaw(board, sq, turn);
  return rawMoves.filter(to => !inCheck(sim(board, sq, to), turn));
}

function getAllLegalMoves(color){
  const moves = [];
  for(let i=0; i<64; i++){
    if(board[i] && (color === 'w' ? isW(board[i]) : isB(board[i]))){
      const m = getLegalMoves(i);
      for(const to of m) moves.push({ f: i, t: to });
    }
  }
  return moves;
}

function updateUI(){
  const GLYPH = {P:'♟',N:'♞',B:'♝',R:'♜',Q:'♛',K:'♚',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
  const underCheck = inCheck(board, turn);
  const activeLegal = getAllLegalMoves(turn);
  const kingSq = board.indexOf(turn === 'w' ? 'K' : 'k');

  isGameOver = activeLegal.length === 0;

  const bGrid = document.getElementById('bGrid');
  bGrid.innerHTML = '';

  for(let idx = 0; idx < 64; idx++){
    const i = perspective === 'w' ? idx : (63 - idx);
    const r = Math.floor(i / 8), c = i % 8;
    const sq = document.createElement('div');
    sq.className = `sq ${(r + c) % 2 === 0 ? 'l' : 'd'}`;
    sq.onclick = () => onSquare(i);

    if(i === sel) sq.classList.add('sel');
    if(underCheck && i === kingSq) sq.classList.add('check-king');

    if(board[i]){
      const s = document.createElement('span');
      s.className = `p-icon ${isW(board[i]) ? 'w' : 'b'}`;
      s.textContent = GLYPH[board[i]];
      sq.appendChild(s);
    }

    if(sel !== null && getLegalMoves(sel).includes(i)){
      const d = document.createElement('div');
      d.className = board[i] ? 'm-ring' : 'm-dot';
      sq.appendChild(d);
    }

    if(hint && (i === hint.f || i === hint.t)){
      const d = document.createElement('div');
      d.className = 'secret-dot';
      sq.appendChild(d);
    }

    bGrid.appendChild(sq);
  }

  const isBotWhite = (perspective === 'w');
  document.getElementById('botPlayerLabel').textContent = isBotWhite 
    ? (isOnline ? (myRole === 'w' ? 'White (You)' : 'White (Opponent)') : 'White (Player 1)')
    : (isOnline ? (myRole === 'b' ? 'Black (You)' : 'Black (Opponent)') : 'Black (Player 2)');

  document.getElementById('topPlayerLabel').textContent = isBotWhite
    ? (isOnline ? (myRole === 'b' ? 'Black (You)' : 'Black (Opponent)') : 'Black (Player 2)')
    : (isOnline ? (myRole === 'w' ? 'White (You)' : 'White (Opponent)') : 'White (Player 1)');

  document.getElementById('botTurn').style.display = (turn === perspective) ? 'inline' : 'none';
  document.getElementById('topTurn').style.display = (turn !== perspective) ? 'inline' : 'none';

  const stMsg = document.getElementById('stMsg');
  if(isGameOver){
    if(underCheck){
      stMsg.textContent = `Checkmate! ${turn === 'w' ? 'Black' : 'White'} wins.`;
      stMsg.style.color = '#ef4444';
    } else {
      stMsg.textContent = 'Stalemate (Draw).';
      stMsg.style.color = '#eab308';
    }
  } else if(underCheck){
    stMsg.textContent = `${turn === 'w' ? 'White' : 'Black'} King is in Check!`;
    stMsg.style.color = '#ef4444';
  } else {
    stMsg.textContent = `${turn === 'w' ? 'White' : 'Black'} to move. Game active.`;
    stMsg.style.color = '#10b981';
  }
}

function onSquare(i){
  if(isGameOver) return;
  if(isOnline && turn !== myRole) return;

  if(sel !== null){
    const moves = getLegalMoves(sel);
    if(moves.includes(i)){
      applyMove(sel, i);
      if(conn && conn.open){
        conn.send({ type: 'move', from: sel, to: i });
      }
      return;
    }
  }
  const p = board[i];
  sel = (p && (turn === 'w' ? isW(p) : isB(p))) ? i : null;
  updateUI();
}

function applyMove(f, to){
  hist.push({ b: [...board], t: turn, f, to });
  board[to] = board[f];
  board[f] = '';
  if(board[to] === 'P' && to < 8) board[to] = 'Q';
  if(board[to] === 'p' && to >= 56) board[to] = 'q';
  turn = (turn === 'w') ? 'b' : 'w';
  sel = null;
  hint = null;
  updateUI();
}

function undo(){
  if(!hist.length) return;
  const last = hist.pop();
  board = last.b;
  turn = last.t;
  sel = null;
  hint = null;
  isGameOver = false;
  updateUI();
}

/* =========================================================
   P2P WEBRTC CONNECTION
   ========================================================= */
function setupConnection() {
  conn.on('open', () => {
    isOnline = true;
    document.getElementById('dotNet').className = 'status-dot online';
    document.getElementById('txtNet').textContent = `Connected (${myRole === 'w' ? 'White' : 'Black'})`;
    updateUI();
  });

  conn.on('data', (data) => {
    if(data.type === 'move'){
      applyMove(data.from, data.to);
    }
  });

  conn.on('close', () => {
    document.getElementById('dotNet').className = 'status-dot';
    document.getElementById('txtNet').textContent = 'Disconnected';
  });
}

function hostRoom() {
  const code = Math.random().toString(36).substring(2, 6).toUpperCase();
  myRole = 'w';
  perspective = 'w';
  peer = new Peer('chess-' + code);
  
  peer.on('open', () => {
    document.getElementById('joinCode').value = code;
    document.getElementById('txtNet').textContent = `Room: ${code} (Waiting...)`;
    document.getElementById('btnHost').textContent = 'Code: ' + code;
    updateUI();
  });

  peer.on('connection', (c) => {
    conn = c;
    setupConnection();
  });
}

function joinRoom() {
  const code = document.getElementById('joinCode').value.trim().toUpperCase();
  if(!code) return alert('Enter code!');
  myRole = 'b';
  perspective = 'b';
  peer = new Peer();

  peer.on('open', () => {
    conn = peer.connect('chess-' + code);
    setupConnection();
    updateUI();
  });
}

/* =========================================================
   COVERT MULTI-TAP ENGINE
   3 Taps = Game Hint
   5 Taps = Set/Flip to Black
   6 Taps = Set/Flip to White
   ========================================================= */
let tapTimes = [];
let tapTimer = null;
const pad = document.getElementById('tapSpace');

function calculateHintFor(color) {
  const moves = getAllLegalMoves(color);
  if (!moves.length) return null;
  
  if (color === 'w' && hist.length === 0 && board[bookMove.f] === 'P') {
    return bookMove;
  }

  let best = moves[0], maxScore = -9999;
  const oppColor = color === 'w' ? 'b' : 'w';

  for (const m of moves) {
    const nb = sim(board, m.f, m.t);
    let sc = 1;
    if (board[m.t]) {
      sc += { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 }[board[m.t].toLowerCase()] || 0;
    }
    if ([27, 28, 35, 36].includes(m.t)) sc += 2;
    if (inCheck(nb, oppColor)) sc += 5;

    if (sc > maxScore) {
      maxScore = sc;
      best = m;
    }
  }
  return best;
}

function executeTapAction(count) {
  if (count === 3) {
    // 3 Taps: Game Hint
    const activeColor = isOnline ? myRole : turn;
    if (turn === activeColor && !isGameOver) {
      hint = hint ? null : calculateHintFor(activeColor);
      updateUI();
    }
  } else if (count === 5) {
    // 5 Taps: Set Black
    myRole = 'b';
    perspective = 'b';
    hint = null;
    updateUI();
  } else if (count === 6) {
    // 6 Taps: Set White
    myRole = 'w';
    perspective = 'w';
    hint = null;
    updateUI();
  }
}

function handleTapEvent(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (tapTimes.length && now - tapTimes[tapTimes.length - 1] < 60) return;
  
  tapTimes.push(now);

  if (tapTimer) clearTimeout(tapTimer);

  tapTimer = setTimeout(() => {
    const totalTaps = tapTimes.length;
    tapTimes = [];
    executeTapAction(totalTaps);
  }, 450);
}

pad.addEventListener('pointerdown', handleTapEvent, { passive: false });
pad.addEventListener('touchstart', handleTapEvent, { passive: false });

updateUI();
</script>
</body>
</html>
