<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess 1v1</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background-color: #0d131f;
    color: #e5e7eb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 10px 8px;
    user-select: none;
    -webkit-user-select: none;
  }
  .app-container {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #172133;
    padding: 8px 12px;
    border-radius: 8px;
  }
  .title { font-weight: 700; color: #f59e0b; font-size: 16px; }
  .btn-group { display: flex; gap: 6px; }
  .btn {
    background: #25334d;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn:active { background: #3b82f6; }

  .player-strip {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #172133;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  .badge {
    background: #d97706;
    color: #fff;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    text-transform: uppercase;
  }
  .badge.inactive { display: none; }

  /* Bulletproof fixed-ratio board */
  .board-box {
    width: 100%;
    position: relative;
    padding-top: 100%; /* Guarantees strict 1:1 square */
    border: 3px solid #332314;
    border-radius: 6px;
    overflow: hidden;
    background: #4a3525;
  }
  .board-grid {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    height: 100%;
  }

  .square {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: pointer;
  }
  .square.light { background-color: #eed6b0; }
  .square.dark  { background-color: #b88756; }
  .square.selected { background-color: #7fa650 !important; }
  .square.last-move { background-color: rgba(255, 235, 59, 0.42); }
  .square.check-alert { background-color: rgba(220, 38, 38, 0.65) !important; }

  /* Legal move indicator */
  .dot {
    position: absolute;
    width: 26%;
    height: 26%;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.22);
    pointer-events: none;
    z-index: 5;
  }
  .dot.capture-ring {
    width: 80%;
    height: 80%;
    background: transparent;
    border: 3px solid rgba(0, 0, 0, 0.25);
    border-radius: 50%;
  }

  /* Built-in scalable piece graphics */
  .piece {
    width: 88%;
    height: 88%;
    pointer-events: none;
    display: block;
    z-index: 2;
  }

  /* The Covert 3-Tap Trigger Zone (Zero suspicion) */
  #stealthPad {
    width: 100%;
    height: 48px;
    background: transparent;
    cursor: pointer;
  }

  /* Micro 1.5-pixel secret hint dot */
  .secret-micro-dot {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 1.5px;
    height: 1.5px;
    background: rgba(120, 120, 120, 0.45);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99;
  }

  .status-box {
    background: #172133;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: #10b981;
    font-weight: 500;
  }

  /* Promotion modal */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
  }
  .modal-box {
    background: #1e293b;
    padding: 16px;
    border-radius: 8px;
    display: flex;
    gap: 12px;
  }
  .promo-btn {
    width: 56px;
    height: 56px;
    background: #334155;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
</style>
</head>
<body>

      <div class="square dark" data-sq="56"></div><div class="square light" data-sq="57"></div><div class="square dark" data-sq="58"></div><div class="square light" data-sq="59"></div><div class="square dark" data-sq="60"></div><div class="square light" data-sq="61"></div><div class="square dark" data-sq="62"></div><div class="square light" data-sq="63"></div>
    </div>
  </div>

  <div class="player-strip">
    <span>White (Player 1)</span>
    <span class="badge" id="whiteTurn">Turn</span>
  </div>

  <!-- The 3-tap empty whitespace zone -->
  <div id="stealthPad" title=""></div>

  <div class="status-box" id="statusMessage">White to move.</div>
</div>

<div class="modal-overlay" id="promoModal">
  <div class="modal-box" id="promoOptions"></div>
</div>

  Q: `<svg viewBox="0 0 45 45" class="piece"><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11-4-14-4.5 14-4.5-14-4 14-7-11 2 12zm0 13h27v-3H9v3z" fill="#fff" stroke="#000" stroke-width="1.5"/><circle cx="6" cy="12" r="2" fill="#fff" stroke="#000"/><circle cx="14" cy="9" r="2" fill="#fff" stroke="#000"/><circle cx="22.5" cy="8" r="2" fill="#fff" stroke="#000"/><circle cx="31" cy="9" r="2" fill="#fff" stroke="#000"/><circle cx="39" cy="12" r="2" fill="#fff" stroke="#000"/></svg>`,

  p: `<svg viewBox="0 0 45 45" class="piece"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03-3 1.06-7.41 5.55-7.41 13.47h23c0-7.92-4.41-12.41-7.41-13.47 1.47-1.19 2.41-3 2.41-5.03 0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#222" stroke="#fff" stroke-width="1.2"/></svg>`,
  n: `<svg viewBox="0 0 45 45" class="piece"><path d="M22 10c1.5 0 3 .5 3.5 2 .5 1.5 0 3-1.5 3.5-1.5.5-2-.5-3.5 1-1.5 1.5-2 3.5-3.5 5.5-1.5 2-3 4-2 6.5s3 3 5.5 3c2.5 0 5-1.5 6.5-3.5 1.5-2 1.5-4.5 1.5-7 0-2.5-.5-5-2-7-1.5-2-4-3-6-3.5z" fill="#222" stroke="#fff" stroke-width="1.2"/></svg>`,
  b: `<svg viewBox="0 0 45 45" class="piece"><path d="M9 36c3.39-.97 10.11.43 13.5-2 3.39 2.43 10.11 1.03 13.5 2 0 0 1.65.54 3 2-.68.97-1.65.99-3 .5-3.39-.97-10.11.46-13.5-1-3.39 1.46-10.11.03-13.5 1-1.35.49-2.32.47-3-.5 1.35-1.46 3-2 3-2zM15 32c2.5 2.5 12.5 2.5 15 0 .5-1.5 0-2 0-2 0-2.5-2.5-4-2.5-4 5.5-1.5 6-11.5-5-15.5-11 4-10.5 14-5 15.5 0 0-2.5 1.5-2.5 4 0 0-.5.5 0 2zM25 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 1 1 5 0z" fill="#222" stroke="#fff" stroke-width="1.2"/></svg>`,
  r: `<svg viewBox="0 0 45 45" class="piece"><path d="M9 39h27v-3H9v3zm3-3v-4.5h21V36H12zm2-4.5v-11h17v11H14zM11 16h23v-5h-4v2h-4v-2h-7v2h-4v-2h-4v5z" fill="#222" stroke="#fff" stroke-width="1.2"/></svg>`,
  q: `<svg viewBox="0 0 45 45" class="piece"><path d="M9 26c8.5-1.5 21-1.5 27 0l2-12-7 11-4-14-4.5 14-4.5-14-4 14-7-11 2 12zm0 13h27v-3H9v3z" fill="#222" stroke="#fff" stroke-width="1.2"/><circle cx="6" cy="12" r="2" fill="#222" stroke="#fff"/><circle cx="14" cy="9" r="2" fill="#222" stroke="#fff"/><circle cx="22.5" cy="8" r="2" fill="#222" stroke="#fff"/><circle cx="31" cy="9" r="2" fill="#222" stroke="#fff"/><circle cx="39" cy="12" r="2" fill="#222" stroke="#fff"/></svg>`,
  k: `<svg viewBox="0 0 45 45" class="piece"><path d="M22.5 11.63V6M20 8h5M22.5 25s4.5-7.5 3-10.5c0 0-1-2.5-3-2.5s-3 2.5-3 2.5c-1.5 3 3 10.5 3 10.5z" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/><path d="M11.5 37c5.5 3.5 15.5 3.5 21 0v-7s9-4.5 6-10.5c-4-1-8 2-8 2s-3-3.5-8-3.5-8 3.5-8 3.5-4-3-8-2c-3 6 6 10.5 6 10.5v7z" fill="#222" stroke="#fff" stroke-width="1.2"/></svg>`
};

const INITIAL_BOARD = [
  'r','n','b','q','k','b','n','r',
  'p','p','p','p','p','p','p','p',
  '','','','','','','','',
  '','','','','','','','',
  '','','','','','','','',
  '','','','','','','','',
  'P','P','P','P','P','P','P','P',
  'R','N','B','Q','K','B','N','R'
];

let board = [...INITIAL_BOARD];
let turn = 'w';
let castling = { K: true, Q: true, k: true, q: true };
let epSquare = null;
let selectedSq = null;
let legalMoves = [];
let moveHistory = [];
let pendingPromo = null;
let activeHint = null;

// Session randomized openings
const OPENINGS = [
  { from: 52, to: 36 }, // e4
  { from: 51, to: 35 }, // d4
  { from: 50, to: 34 }, // c4
  { from: 62, to: 45 }  // Nf3
];
let chosenOpening = OPENINGS[Math.floor(Math.random() * OPENINGS.length)];

function isWhite(p) { return p && p === p.toUpperCase(); }
function isBlack(p) { return p && p === p.toLowerCase(); }
function isOpponent(p, player) { return player === 'w' ? isBlack(p) : isWhite(p); }

function getRawMoves(b, from, ep, cRights) {
  const p = b[from];
  if (!p) return [];
  const moves = [];
  const r = Math.floor(from / 8), c = from % 8;
  const isW = isWhite(p);
  const color = isW ? 'w' : 'b';

  if (p.toUpperCase() === 'P') {
    const dir = isW ? -1 : 1;
    const startRow = isW ? 6 : 1;
    const nextSq = from + dir * 8;
    if (nextSq >= 0 && nextSq < 64 && !b[nextSq]) {
      moves.push(nextSq);
      const next2 = from + dir * 16;
      if (r === startRow && !b[next2]) moves.push(next2);
    }
    for (const dc of [-1, 1]) {
      const tc = c + dc;
      if (tc >= 0 && tc < 8) {
        const target = (r + dir) * 8 + tc;
        if (target >= 0 && target < 64) {
          if (b[target] && isOpponent(b[target], color)) moves.push(target);
          if (target === ep) moves.push(target);
        }
      }
    }
  } else if (p.toUpperCase() === 'N') {
    const jumps = [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]];
    for (const [dr, dc] of jumps) {
      const tr = r + dr, tc = c + dc;
      if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
        const t = tr * 8 + tc;
        if (!b[t] || isOpponent(b[t], color)) moves.push(t);
      }
    }
  } else if (p.toUpperCase() === 'K') {
    for (let dr = -1; dr <= 1; dr++) {
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const tr = r + dr, tc = c + dc;
        if (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
          const t = tr * 8 + tc;
          if (!b[t] || isOpponent(b[t], color)) moves.push(t);
        }
      }
    }
    // Castling
    if (isW && from === 60) {
      if (cRights.K && !b[61] && !b[62] && b[63] === 'R') moves.push(62);
      if (cRights.Q && !b[59] && !b[58] && !b[57] && b[56] === 'R') moves.push(58);
    } else if (!isW && from === 4) {
      if (cRights.k && !b[5] && !b[6] && b[7] === 'r') moves.push(6);
      if (cRights.q && !b[3] && !b[2] && !b[1] && b[0] === 'r') moves.push(2);
    }
  } else {
    // Sliding pieces: B, R, Q
    const dirs = [];
    if (['B','Q'].includes(p.toUpperCase())) dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if (['R','Q'].includes(p.toUpperCase())) dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    for (const [dr, dc] of dirs) {
      let tr = r + dr, tc = c + dc;
      while (tr >= 0 && tr < 8 && tc >= 0 && tc < 8) {
        const t = tr * 8 + tc;
        if (!b[t]) {
          moves.push(t);
        } else {
          if (isOpponent(b[t], color)) moves.push(t);
          break;
        }
        tr += dr; tc += dc;
      }
    }
  }
  return moves;
}

function simulateMove(b, from, to, ep) {
  const nb = [...b];
  const p = nb[from];
  nb[to] = p;
  nb[from] = '';
  // EP capture
  if (p.toUpperCase() === 'P' && to === ep) {
    const isW = isWhite(p);
    const capSq = to + (isW ? 8 : -8);
    nb[capSq] = '';
  }
  // Promotion to Queen in check simulation
  if (p === 'P' && to < 8) nb[to] = 'Q';
  if (p === 'p' && to >= 56) nb[to] = 'q';
  // Castling rook move
  if (p === 'K') {
    if (from === 60 && to === 62) { nb[61] = 'R'; nb[63] = ''; }
    if (from === 60 && to === 58) { nb[59] = 'R'; nb[56] = ''; }
  } else if (p === 'k') {
    if (from === 4 && to === 6) { nb[5] = 'r'; nb[7] = ''; }
    if (from === 4 && to === 2) { nb[3] = 'r'; nb[0] = ''; }
  }
  return nb;
}

function isSquareAttacked(b, sq, byColor) {
  for (let i = 0; i < 64; i++) {
    const piece = b[i];
    if (!piece) continue;
    if (byColor === 'w' && isWhite(piece) || byColor === 'b' && isBlack(piece)) {
      const moves = getRawMoves(b, i, null, { K:false, Q:false, k:false, q:false });
      if (moves.includes(sq)) return true;
    }
  }
  return false;
}

function isKingInCheck(b, color) {
  const kingChar = color === 'w' ? 'K' : 'k';
  const kSq = b.indexOf(kingChar);
  if (kSq === -1) return false;
  return isSquareAttacked(b, kSq, color === 'w' ? 'b' : 'w');
}

function getLegalMoves(from) {
  const p = board[from];
  if (!p || (turn === 'w' ? !isWhite(p) : !isBlack(p))) return [];
  const raw = getRawMoves(board, from, epSquare, castling);
  const color = turn;
  const oppColor = color === 'w' ? 'b' : 'w';

  return raw.filter(to => {
    // Castling check path restrictions
    if (p.toUpperCase() === 'K' && Math.abs(to - from) === 2) {
      if (isKingInCheck(board, color)) return false;
      const mid = from + (to > from ? 1 : -1);
      if (isSquareAttacked(board, mid, oppColor)) return false;
    }
    const nb = simulateMove(board, from, to, epSquare);
    return !isKingInCheck(nb, color);
  });
}

function getAllLegalMoves(color) {
  const result = [];
  for (let i = 0; i < 64; i++) {
    const p = board[i];
    if (p && (color === 'w' ? isWhite(p) : isBlack(p))) {
      const ms = getLegalMoves(i);
      for (const to of ms) result.push({ from: i, to });
    }
  }
  return result;
}
