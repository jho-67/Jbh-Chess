<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chess 1v1</title>
<style>
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    -webkit-tap-highlight-color: transparent; 
  }
  body {
    background: #0d131f;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    padding: 10px 8px;
    user-select: none;
    -webkit-user-select: none;
    overflow-x: hidden;
  }
  .app { 
    width: 100%; 
    max-width: 400px; 
    display: flex; 
    flex-direction: column; 
    gap: 8px; 
  }
  .bar { 
    display: flex; 
    justify-content: space-between; 
    align-items: center; 
    background: #172133; 
    padding: 8px 12px; 
    border-radius: 6px; 
    font-size: 14px; 
    font-weight: bold; 
    height: 38px;
  }
  .btn { 
    background: #25334d; 
    color: #fff; 
    border: none; 
    border-radius: 5px; 
    padding: 6px 12px; 
    cursor: pointer; 
  }
  .badge { 
    background: #d97706; 
    padding: 2px 6px; 
    border-radius: 4px; 
    font-size: 11px; 
  }

  /* FROZEN BOARD GEOMETRY - NEVER RESIZES OR DISTORTS */
  .board-wrap { 
    width: 100%; 
    position: relative; 
    padding-top: 100%; /* Permanent 1:1 aspect ratio */
    border: 3px solid #332314; 
    border-radius: 4px; 
    background: #4a3525;
    overflow: hidden;
    contain: layout size paint; /* Enforces hardware paint confinement */
  }
  .board { 
    position: absolute; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    display: grid; 
    grid-template-columns: repeat(8, 12.5%); 
    grid-template-rows: repeat(8, 12.5%); 
  }
  .sq { 
    width: 100%;
    height: 100%;
    display: flex; 
    align-items: center; 
    justify-content: center; 
    position: relative; 
    overflow: hidden; /* Stops any piece size variation from leaking */
    cursor: pointer; 
    contain: strict;
  }
  .l { background: #eed6b0; }
  .d { background: #b88756; }
  .sel { background: #7fa650 !important; }

  /* Normalized Pieces: Zero font jitter across Android/iOS */
  .p-icon {
    font-size: min(8vw, 36px);
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    user-select: none;
    transform: translateY(-1px);
  }
  .w { color: #ffffff; text-shadow: 0 0 2px #000, 0 1px 3px #000; }
  .b { color: #151515; text-shadow: 0 0 1px #fff; }

  /* 1px x 1px ultra-stealth faint micro-pixel */
  .secret-dot {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 1px;
    height: 1px;
    background: rgba(100, 95, 90, 0.48);
    pointer-events: none;
    z-index: 20;
  }

  /* Covert 3-tap trigger zone */
  #tapSpace {
    width: 100%;
    height: 52px;
    background: transparent;
    cursor: pointer;
    touch-action: manipulation;
  }
  .status { 
    background: #172133; 
    padding: 8px 12px; 
    border-radius: 6px; 
    font-size: 13px; 
    color: #10b981; 
    height: 36px;
    display: flex;
    align-items: center;
  }
</style>
</head>
<body>

<div class="app">
  <div class="bar">
    <span style="color:#f59e0b">Chess 1v1</span>
    <div>
      <button class="btn" onclick="undo()">Undo</button>
      <button class="btn" onclick="location.reload()">New</button>
    </div>
  </div>

  <div class="bar">
    <span>Black (Player 2)</span>
    <span id="bTurn" class="badge" style="display:none">TURN</span>
  </div>

  <div class="board-wrap">
    <div class="board" id="bGrid">
      <div class="sq l"><span class="p-icon b">♜</span></div><div class="sq d"><span class="p-icon b">♞</span></div><div class="sq l"><span class="p-icon b">♝</span></div><div class="sq d"><span class="p-icon b">♛</span></div><div class="sq l"><span class="p-icon b">♚</span></div><div class="sq d"><span class="p-icon b">♝</span></div><div class="sq l"><span class="p-icon b">♞</span></div><div class="sq d"><span class="p-icon b">♜</span></div>
      <div class="sq d"><span class="p-icon b">♟</span></div><div class="sq l"><span class="p-icon b">♟</span></div><div class="sq d"><span class="p-icon b">♟</span></div><div class="sq l"><span class="p-icon b">♟</span></div><div class="sq d"><span class="p-icon b">♟</span></div><div class="sq l"><span class="p-icon b">♟</span></div><div class="sq d"><span class="p-icon b">♟</span></div><div class="sq l"><span class="p-icon b">♟</span></div>
      <div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div>
      <div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div>
      <div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div>
      <div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div><div class="sq d"></div><div class="sq l"></div>
      <div class="sq l"><span class="p-icon w">♟</span></div><div class="sq d"><span class="p-icon w">♟</span></div><div class="sq l"><span class="p-icon w">♟</span></div><div class="sq d"><span class="p-icon w">♟</span></div><div class="sq l"><span class="p-icon w">♟</span></div><div class="sq d"><span class="p-icon w">♟</span></div><div class="sq l"><span class="p-icon w">♟</span></div><div class="sq d"><span class="p-icon w">♟</span></div>
      <div class="sq d"><span class="p-icon w">♜</span></div><div class="sq l"><span class="p-icon w">♞</span></div><div class="sq d"><span class="p-icon w">♝</span></div><div class="sq l"><span class="p-icon w">♛</span></div><div class="sq d"><span class="p-icon w">♚</span></div><div class="sq l"><span class="p-icon w">♝</span></div><div class="sq d"><span class="p-icon w">♞</span></div><div class="sq l"><span class="p-icon w">♜</span></div>
    </div>
  </div>

  <div class="bar">
    <span>White (Player 1)</span>
    <span id="wTurn" class="badge">TURN</span>
  </div>

  <!-- Covert 3-tap whitespace trigger -->
  <div id="tapSpace"></div>

  <div class="status" id="stMsg">White to move. Game active.</div>
</div>

<script>
const S = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','','P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];
let board = [...S], turn = 'w', sel = null, hist = [], hint = null;

const OPENS = [{f:52,t:36},{f:51,t:35},{f:50,t:34},{f:62,t:45}];
const bookMove = OPENS[Math.floor(Math.random()*OPENS.length)];

const squares = Array.from(document.querySelectorAll('.sq'));
squares.forEach((sq, i) => sq.onclick = () => onSquare(i));

function isW(p){ return p && p === p.toUpperCase(); }
function isB(p){ return p && p === p.toLowerCase(); }

function getMoves(sq){
  const p = board[sq];
  if(!p || (turn === 'w' ? !isW(p) : !isB(p))) return [];
  const m = [], r = Math.floor(sq/8), c = sq%8, T = p.toUpperCase();
  const d = (turn === 'w') ? -1 : 1;
  const opp = turn === 'w' ? isB : isW;

  if(T === 'P'){
    const f1 = (r+d)*8 + c;
    if(!board[f1]) {
      m.push(f1);
      const f2 = (r+d*2)*8 + c;
      if(((turn === 'w' && r === 6) || (turn === 'b' && r === 1)) && !board[f2]) m.push(f2);
    }
    for(const dc of [-1, 1]){
      const tc = c + dc;
      if(tc >= 0 && tc < 8){
        const cap = (r+d)*8 + tc;
        if(opp(board[cap])) m.push(cap);
      }
    }
  } else if(T === 'N'){
    for(const [dr,dc] of [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]]){
      const tr = r+dr, tc = c+dc;
      if(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!board[t] || opp(board[t])) m.push(t);
      }
    }
  } else if(T === 'K'){
    for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++){
      if(!dr && !dc) continue;
      const tr = r+dr, tc = c+dc;
      if(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!board[t] || opp(board[t])) m.push(t);
      }
    }
  } else {
    const dirs = [];
    if(T==='B'||T==='Q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
    if(T==='R'||T==='Q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
    for(const [dr,dc] of dirs){
      let tr = r+dr, tc = c+dc;
      while(tr>=0 && tr<8 && tc>=0 && tc<8){
        const t = tr*8 + tc;
        if(!board[t]) m.push(t);
        else { if(opp(board[t])) m.push(t); break; }
        tr += dr; tc += dc;
      }
    }
  }
  return m;
}

function updateUI(){
  const GLYPH = {P:'♟',N:'♞',B:'♝',R:'♜',Q:'♛',K:'♚',p:'♟',n:'♞',b:'♝',r:'♜',q:'♛',k:'♚'};
  squares.forEach((sq, i) => {
    sq.innerHTML = '';
    sq.classList.toggle('sel', i === sel);
    if(board[i]){
      const s = document.createElement('span');
      s.className = `p-icon ${isW(board[i]) ? 'w' : 'b'}`;
      s.textContent = GLYPH[board[i]];
      sq.appendChild(s);
    }
    if(hint && (i === hint.f || i === hint.t)){
      const d = document.createElement('div');
      d.className = 'secret-dot';
      sq.appendChild(d);
    }
  });
  document.getElementById('wTurn').style.display = turn === 'w' ? 'inline' : 'none';
  document.getElementById('bTurn').style.display = turn === 'b' ? 'inline' : 'none';
  document.getElementById('stMsg').textContent = `${turn === 'w' ? 'White' : 'Black'} to move. Game active.`;
}

function onSquare(i){
  if(sel !== null){
    const moves = getMoves(sel);
    if(moves.includes(i)){
      hist.push({b:[...board], t:turn, f:sel, to:i});
      board[i] = board[sel];
      board[sel] = '';
      if(board[i]==='P' && i < 8) board[i] = 'Q';
      if(board[i]==='p' && i >= 56) board[i] = 'q';
      turn = (turn === 'w') ? 'b' : 'w';
      sel = null;
      hint = null;
      updateUI();
      return;
    }
  }
  const p = board[i];
  sel = (p && (turn === 'w' ? isW(p) : isB(p))) ? i : null;
  updateUI();
}

function undo(){
  if(!hist.length) return;
  const last = hist.pop();
  board = last.b;
  turn = last.t;
  sel = null;
  hint = null;
  updateUI();
}

// Secret 3-Tap Handler
let tapTimes = [];
const pad = document.getElementById('tapSpace');

function triggerSecretTap(e) {
  if (e && e.cancelable) e.preventDefault();
  const now = Date.now();
  if (tapTimes.length && now - tapTimes[tapTimes.length - 1] < 60) return;
  tapTimes.push(now);
  tapTimes = tapTimes.filter(t => now - t <= 2000);

  if (tapTimes.length >= 3) {
    tapTimes = [];
    if (turn === 'w') {
      if (hint) {
        hint = null;
      } else if (hist.length === 0 && board[bookMove.f] === 'P') {
        hint = bookMove;
      } else {
        let best = null, maxScore = -9999;
        for (let i = 0; i < 64; i++) {
          if (board[i] && isW(board[i])) {
            for (const to of getMoves(i)) {
              let sc = 1;
              if (board[to]) {
                sc += { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 }[board[to].toLowerCase()] || 0;
              }
              if ([27, 28, 35, 36].includes(to)) sc += 2;
              if (sc > maxScore) {
                maxScore = sc;
                best = { f: i, t: to };
              }
            }
          }
        }
        hint = best;
      }
      updateUI();
    }
  }
}

pad.addEventListener('pointerdown', triggerSecretTap, { passive: false });
pad.addEventListener('touchstart', triggerSecretTap, { passive: false });
</script>
</body>
 </html>
